{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Zoom Clone</title>
  <link rel="shortcut icon" href="https://st1.zoom.us/homepage/publish/zoom.ico" />
  <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #145DFF, #2D8CFF);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .forgot-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .forgot-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .zoom-logo img {
      height: 48px;
      margin-bottom: 20px;
    }

    .forgot-title {
      font-size: 2rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 1.5rem;
    }

    .forgot-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .forgot-form input[type="email"] {
      padding: 10px 15px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transition: all 0.3s ease;
    }

    .forgot-form input[type="email"]::placeholder {
      color: #e0e0e0;
    }

    .forgot-form input[type="email"]:focus {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 6px rgba(45, 140, 255, 0.8);
    }

    .btn-forgot {
      padding: 10px;
      background-color: #2D8CFF;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn-forgot:hover {
      background-color: #145DFF;
      transform: scale(1.05);
    }

    .success-msg {
      color: #00ff88;
      font-size: 1rem;
      font-weight: 500;
    }

    .error-msg {
      color: #ffaaaa;
      font-size: 1rem;
      font-weight: 500;
    }

    .back-link {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #eeeeee;
    }

    .back-link a {
      color: #ffffff;
      text-decoration: underline;
      transition: color 0.3s ease;
    }

    .back-link a:hover {
      color: #aad8ff;
    }

    .visually-hidden {
      position: absolute !important;
      height: 1px;
      width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
      border: 0;
      padding: 0;
      margin: -1px;
    }

    @media (max-width: 480px) {
      .forgot-container {
        padding: 30px 20px;
      }

      .forgot-title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="forgot-wrapper">
    <div class="forgot-container">
      <div class="zoom-logo">
        <img src="https://st1.zoom.us/homepage/publish/zoom.ico" alt="Zoom Logo" />
      </div>
      <h2 class="forgot-title">Forgot Password</h2>
      <form action="" method="POST" class="forgot-form">
        {% csrf_token %}
        <label for="email" class="visually-hidden">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required />
        <input type="submit" value="Send Reset Link" class="btn-forgot" />

        {% if success %}
          <p class="success-msg">{{ success }}</p>
        {% endif %}
        {% if error %}
          <p class="error-msg">{{ error }}</p>
        {% endif %}
      </form>
      <div class="back-link">
        <a href="{% url 'login' %}">&larr; Back to Login</a>
      </div>
    </div>
  </div>
</body>
</html>
