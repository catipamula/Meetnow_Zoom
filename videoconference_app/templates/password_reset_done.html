{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset Complete - Zoom Clone</title>
  <link rel="shortcut icon" href="https://st1.zoom.us/homepage/publish/zoom.ico" />
  <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #145DFF, #2D8CFF);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .done-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .done-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .zoom-logo img {
      height: 48px;
      margin-bottom: 20px;
    }
    .done-title {
      font-size: 2rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 1.5rem;
    }
    .success-msg {
      color: #00ff88;
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }
    .back-link {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #eeeeee;
    }
    .back-link a {
      color: #ffffff;
      text-decoration: underline;
      transition: color 0.3s ease;
    }
    .back-link a:hover {
      color: #aad8ff;
    }
    @media (max-width: 480px) {
      .done-container {
        padding: 30px 20px;
      }
      .done-title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="done-wrapper">
    <div class="done-container">
      <div class="zoom-logo">
        <img src="https://st1.zoom.us/homepage/publish/zoom.ico" alt="Zoom Logo" />
      </div>
      <h2 class="done-title">Password Reset Complete</h2>
      <p class="success-msg">Your password has been set. You may now log in with your new password.</p>
      <div class="back-link">
        <a href="{% url 'login' %}">&larr; Back to Login</a>
      </div>
    </div>
  </div>
</body>
</html>
