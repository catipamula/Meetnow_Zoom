{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Zoom Clone</title>
  <meta name="description" content="Contact Zoom Clone support team for help, feedback, or partnership opportunities.">
  <link rel="stylesheet" href="{% static 'css/contact.css' %}" />
  <link rel="shortcut icon" href="https://st1.zoom.us/homepage/publish/zoom.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/4b8b0b6e8b.js" crossorigin="anonymous"></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      background: #f7f9fb;
      color: #222;
    }
    .hero-section {
      background: linear-gradient(120deg, #4f8cff, #3358e6);
      color: #fff;
      padding: 3rem 1rem 2rem 1rem;
      text-align: center;
    }
    .hero-section h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .hero-section p {
      font-size: 1.2rem;
    }
    .main-content {
      max-width: 1100px;
      margin: -3rem auto 0 auto;
      padding: 0 1rem 2rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: space-between;
    }
    .contact-info, .contact-form-section {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 2px 16px rgba(80, 120, 200, 0.08);
      padding: 2rem;
    }
    .contact-info {
      flex: 1 1 320px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .info-card {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .info-card .icon {
      font-size: 1.8rem;
      color: #4f8cff;
    }
    .info-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
    }
    .info-card p, .info-card a {
      margin: 0;
      font-size: 0.95rem;
      color: #333;
      text-decoration: none;
    }
    .contact-form-section {
      flex: 2 1 400px;
    }
    .contact-form-section h2 {
      margin-top: 0;
      color: #3358e6;
      font-size: 1.4rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    label {
      font-weight: 600;
      color: #3358e6;
    }
    input, textarea {
      padding: 0.7rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    input:focus, textarea:focus {
      border-color: #4f8cff;
      outline: none;
      background: #fff;
    }
    textarea {
      min-height: 100px;
    }
    button[type="submit"] {
      background: linear-gradient(120deg, #4f8cff, #3358e6);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.9rem 0;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.7rem;
    }
    button:hover {
      background: linear-gradient(120deg, #3358e6, #4f8cff);
    }
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3358e6;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }
    .map-section {
      width: 100%;
      margin-top: 2rem;
    }
    .map-container {
      width: 100%;
      height: 320px;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(80, 120, 200, 0.08);
    }
    .map-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .footer {
      background: #3358e6;
      color: #fff;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
      font-size: 0.95rem;
      border-radius: 1rem 1rem 0 0;
    }
    .toast {
      display: none;
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      min-width: 260px;
      max-width: 90vw;
      background: #fff;
      color: #222;
      border-left: 5px solid #4f8cff;
      border-radius: 0.7rem;
      box-shadow: 0 2px 16px rgba(80, 120, 200, 0.18);
      padding: 1rem 1.5rem;
      z-index: 1000;
      font-size: 1rem;
      align-items: center;
      gap: 1rem;
    }
    .toast.show {
      display: flex;
    }
    #closeToast {
      background: none;
      border: none;
      color: #888;
      font-size: 1.3rem;
      margin-left: auto;
      cursor: pointer;
    }
    @media (max-width: 900px) {
      .main-content {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <header class="hero-section">
    <h1>Contact Us</h1>
    <p>We’re here to help you with support, feedback or partnership inquiries.</p>
  </header>

  <main class="main-content">
    <section class="contact-info">
      <div class="info-card">
        <span class="icon"><i class="fas fa-envelope"></i></span>
        <div>
          <h2>Email</h2>
          <p><a href="mailto:chakravarthi636@gmail.com">support@Atipamula chakravarthi</a></p>
        </div>
      </div>
      <div class="info-card">
        <span class="icon"><i class="fas fa-phone"></i></span>
        <div>
          <h2>Phone</h2>
          <p><a href="tel:+917013010980">+91 7013010900</a></p>
        </div>
      </div>
      <div class="info-card">
        <span class="icon"><i class="fas fa-map-marker-alt"></i></span>
        <div>
          <h2>Address</h2>
          <p>Mangalagiri</p>
        </div>
      </div>
    </section>

    <section class="contact-form-section">
      <h2>Send Us a Message</h2>
      <form id="contactForm" action="{% url 'contact' %}" method="post" onsubmit="submitForm(event)">
        {% csrf_token %}
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required />
        </div>
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>
        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" placeholder="Type your message..." required></textarea>
        </div>
        <button type="submit" id="submitBtn">
          <span id="btnText">Send Message</span>
          <span id="btnLoader" class="loader" style="display:none;"></span>
        </button>
      </form>
    </section>
  </main>

  <section class="map-section">
    <div class="map-container">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2914.9198904737623!2d80.56441727366486!3d16.436674729499313!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a35f1da496abcc1%3A0x192ce8dd92b47e64!2sChakravarthi%20Atipamula(Home)!5e1!3m2!1sen!2sin!4v1753271528997!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; Zoom Clone. All rights reserved.</p>
  </footer>

  <!-- Toast -->
  <div id="toast" class="toast">
    <span id="toastMsg">Message sent!</span>
    <button id="closeToast" onclick="hideToast()">&times;</button>
  </div>

  <script>
    function submitForm(event) {
      event.preventDefault();
      const form = event.target;
      const data = new FormData(form);
      const btn = document.getElementById('submitBtn');
      const text = document.getElementById('btnText');
      const loader = document.getElementById('btnLoader');
      btn.disabled = true;
      text.style.display = 'none';
      loader.style.display = 'inline-block';

      fetch(form.action, {
        method: 'POST',
        headers: {
          'X-CSRFToken': '{{ csrf_token }}',
        },
        body: data,
      })
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            showToast(data.message);
            form.reset();
          } else {
            showToast(data.message || 'Submission failed');
          }
        })
        .catch(() => showToast('Something went wrong!'))
        .finally(() => {
          btn.disabled = false;
          text.style.display = 'inline';
          loader.style.display = 'none';
        });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = message;
      toast.classList.add('show');
      setTimeout(() => hideToast(), 4000);
    }

    function hideToast() {
      document.getElementById('toast').classList.remove('show');
    }
  </script>

</body>
</html>
