<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom | Video Call</title>
    <link rel="shortcut icon" href="https://st1.zoom.us/homepage/publish/zoom.ico">
    <style>
        #root {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
    <script>
        window.onload = function () {
            function getUrlParams(url) {
                let urlStr = url.split('?')[1];
                if (!urlStr) return {};
                const urlSearchParams = new URLSearchParams(urlStr);
                const result = Object.fromEntries(urlSearchParams.entries());
                return result;
            }

            const params = getUrlParams(window.location.href);
            const roomID = params['roomID'] || (Math.floor(Math.random() * 10000) + "");
            const userID = Math.floor(Math.random() * 10000) + "";
            const userName = "{{ name|default:'User' }}";
            const appID = 2028868635;
            const serverSecret = "f57b818176b3c2dca1f04345c7e52c92";
            const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomID, userID, userName);

            const zp = ZegoUIKitPrebuilt.create(kitToken);
            zp.joinRoom({
                container: document.querySelector("#root"),
                sharedLinks: [{
                    name: 'Personal link',
                    url: window.location.protocol + '//' + window.location.host + window.location.pathname + '?roomID=' + roomID,
                }],
                scenario: {
                    mode: ZegoUIKitPrebuilt.VideoConference,
                },
                turnOnMicrophoneWhenJoining: false,
                turnOnCameraWhenJoining: false,
                showMyCameraToggleButton: true,
                showMyMicrophoneToggleButton: true,
                showAudioVideoSettingsButton: true,
                showScreenSharingButton: true,
                showTextChat: true,
                showUserList: true,
                maxUsers: 50,
                layout: "Grid",
                showLayoutButton: true,
                onLeaveRoom: () => {
                    window.location.href = '/dashboard/';
                }
            });

            // WebSocket connection for random call or room updates
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const socket = new WebSocket(protocol + window.location.host + '/ws/randomcall/' + roomID + '/');

            socket.onmessage = function (e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.leave) {
                        alert(data.message);
                        window.location.href = '/dashboard/';
                    }
                } catch (err) {
                    console.error('Socket message parse error:', err);
                }
            };

            socket.onclose = function (e) {
                console.log('Chat socket closed');
            };
        }
    </script>
</body>
</html>
